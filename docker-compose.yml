version: '3.8'
services:
  # Desarrollo local: la API sirve también el frontend (montado desde ./frontend)
  zorryfy:
    build: ./backend
    container_name: zorryfy-player
    ports:
      - "8000:8000"
    environment:
      MUSIC_ROOT: /app/music
      SERVE_FRONTEND: "true"
      FRONTEND_DIR: /app/frontend
      SCAN_ON_STARTUP: "true"
      MAX_UPLOAD_MB: "25"
      MAX_TOTAL_UPLOAD_MB: "200"
      QUEUE_HISTORY_LIMIT: "50"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret}
      # Producción: la cadena mongodb+srv:// de MongoDB Atlas (en .env, nunca en el repo)
      MONGO_URI: ${MONGO_URI:-mongodb://zorryfy_app:zorryfy_app_dev_password@mongo:27017/zorryfy?authSource=zorryfy}
      MONGO_DB: zorryfy
      AUTH_TZ_OFFSET_HOURS: "-5"
      TERMS_VERSION: "1.0"
      DEMO_MODE: ${DEMO_MODE:-false}
      # Llaves de cifrado (generar con: python -m app.crypto). Obligatorias con MONGO_URI.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Define DATA_ENCRYPTION_KEY en .env}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-k1}
      DATA_ENCRYPTION_OLD_KEYS: ${DATA_ENCRYPTION_OLD_KEYS:-}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?Define BLIND_INDEX_KEY en .env}
      # Notificaciones push (confirmación del email). Generar con: python -m app.crypto
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:soporte@zorryfy.app}
    volumes:
      - ./backend/music:/app/music
      - ./frontend:/app/frontend:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # MongoDB local solo para desarrollo; en producción se usa MongoDB Atlas
  mongo:
    image: mongo:7
    container_name: zorryfy-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root_dev_password}
      MONGO_DB: zorryfy
      CREATE_APP_USER: "true"
      MONGO_APP_USER: ${MONGO_APP_USER:-zorryfy_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-zorryfy_app_dev_password}
    # Solo accesible en localhost; la app llega por la red interna de compose
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./backend/db/mongo-init.js:/docker-entrypoint-initdb.d/01-zorryfy-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
