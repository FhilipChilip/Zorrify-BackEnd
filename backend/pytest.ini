[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    regression: pruebas de regresión (errores reales que no deben volver)
    security: pruebas de seguridad
    integration: requieren MongoDB real (MONGO_TEST_URI)
    e2e: pruebas de punta a punta en navegador (Playwright + Edge)
filterwarnings =
    ignore::DeprecationWarning
